server {
    listen 8443 ssl;
    server_name 106.15.77.40;
    ssl_certificate /etc/letsencrypt-link/live/106.15.77.40/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-link/live/106.15.77.40/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/link-demo/current/frontend/dist;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    location /api/ {
        proxy_pass http://127.0.0.1:5012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
    location /models/ { expires 7d; try_files $uri =404; }
    location /assets/ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
